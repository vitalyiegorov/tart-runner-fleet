version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
      - path: _test\.go
        linters: [errcheck]
      - path: internal/cli/
        linters: [errcheck]
      - path: internal/daemon/daemon\.go
        linters: [errcheck]
  settings:
    depguard:
      rules:
        # ADR 0019: merging fleetd and fleetctl into one executable removed the
        # dependency-graph guarantee that the operator interface cannot reach
        # the store. This rule restores it as a build gate.
        operator-cli-never-touches-the-store:
          files:
            - "**/internal/cli/*.go"
          deny:
            - pkg: github.com/vitalyiegorov/tart-runner-fleet/internal/adapters/sqlite
              desc: the operator interface must reach daemon state only through the admin API
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
