version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
      - path: _test\.go
        linters: [errcheck]
      - path: internal/cli/
        linters: [errcheck]
      - path: internal/daemon/daemon\.go
        linters: [errcheck]
  settings:
    depguard:
      rules:
        # ADR 0019: merging fleetd and fleetctl into one executable removed the
        # dependency-graph guarantee that the operator interface cannot reach
        # the store. This rule restores it as a build gate.
        operator-cli-never-touches-the-store:
          files:
            - "**/internal/cli/*.go"
          deny:
            - pkg: github.com/vitalyiegorov/tart-runner-fleet/internal/adapters/sqlite
              desc: the operator interface must reach daemon state only through the admin API
        # ADR 0034 / issue #137: a node's execution technology is chosen once, in
        # the wiring package. Every layer above it speaks internal/executor, so
        # the container backend of issue #139 is a wiring change and not a
        # rewrite. internal/daemon is deliberately absent: choosing the
        # implementation is its job.
        lifecycle-never-names-a-backend:
          files:
            - "**/internal/lifecycle/*.go"
            - "**/internal/app/*.go"
            - "**/internal/reconcile/*.go"
            - "**/internal/scheduler/*.go"
            - "**/internal/discharge/*.go"
          deny:
            - pkg: github.com/vitalyiegorov/tart-runner-fleet/internal/adapters/tart
              desc: use the internal/executor port; a backend adapter is chosen only in internal/daemon
            - pkg: github.com/vitalyiegorov/tart-runner-fleet/internal/adapters/macos
              desc: use the internal/executor host probe port; a host adapter is chosen only in internal/daemon
            - pkg: github.com/vitalyiegorov/tart-runner-fleet/internal/adapters/linux
              desc: use the internal/executor host probe port; a host adapter is chosen only in internal/daemon
            - pkg: github.com/vitalyiegorov/tart-runner-fleet/internal/adapters/noexecutor
              desc: use the internal/executor port; a backend adapter is chosen only in internal/daemon
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
