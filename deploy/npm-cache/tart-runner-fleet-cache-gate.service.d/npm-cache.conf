# Gives the gate its npm route (ADR 0093). Install as
# ~/.config/systemd/user/tart-runner-fleet-cache-gate.service.d/npm-cache.conf, only
# on the node that runs the npm cache. It is a drop-in so the shipped gate unit stays
# the same on every node. Removing it and restarting the gate removes the route.
[Unit]
Wants=tart-runner-fleet-npm-cache.service
After=tart-runner-fleet-npm-cache.service

[Service]
ExecStart=
ExecStart=%h/.local/share/tart-runner-fleet/current/fleet cache-gate --listen 0.0.0.0:3017 --upstream http://127.0.0.1:3018 --metrics-listen 127.0.0.1:3019 --identity-key %h/.local/share/tart-runner-fleet/state/cache-gate-identity.key --npm-upstream http://127.0.0.1:3020
