# The hardened Verdaccio config of a node's npm read-through cache (ADR 0092).
# Install as ~/.config/tart-runner-fleet-npm-cache/config.yaml; the quadlet mounts
# it read-only. `fleet cache-gate` is the only thing that talks to this server, and
# it refuses every write on its own, so this file is the second lock, not the first.

storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

# Advertised tarball URLs stay behind the gate. The host comes from each request's
# X-Forwarded-Host, which the gate sets, so Tart and Podman guests each get an
# address they can reach. Never set VERDACCIO_PUBLIC_URL: it would pin one of them.
url_prefix: /npm/

web:
  enable: false

# Registration off: no account can ever exist, so no token can ever be issued.
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: -1

# Anonymous and npmjs only. There is no auth block and no second uplink, so a
# private package cannot resolve here: it answers 404 instead of leaking a name.
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    # How stale metadata may be before Verdaccio asks npmjs again. A release newer
    # than this is invisible to a resolve until then; a frozen lockfile never asks.
    maxage: 10m
    timeout: 30s
    max_fails: 5
    fail_timeout: 2m
    agent_options:
      keepAlive: true
      maxSockets: 32

# `$nobody` is a group no user can hold, because no user can exist.
packages:
  '@*/*':
    access: $all
    publish: $nobody
    unpublish: $nobody
    proxy: npmjs
  '**':
    access: $all
    publish: $nobody
    unpublish: $nobody
    proxy: npmjs

# Nothing a guest may send needs a body: the gate forwards none.
max_body_size: 1mb

# Audit is a write to npmjs on a guest's behalf, and the gate refuses it anyway.
middlewares:
  audit:
    enabled: false

log:
  type: stdout
  format: json
  level: warn
