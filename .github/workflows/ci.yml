name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede review builds, but never discard a main commit that must become
  # an immutable production release.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.12.2

# Self-hosted execution policy for a public repository.
#
# Every job below that carries a `self-hosted` label runs untrusted-by-default
# repository content on the maintainer's physical Mac mini inside an ephemeral
# Tart VM. A pull request opened from a fork is arbitrary code, so no fork head
# may ever be scheduled onto the fleet, even after a maintainer approves the
# run. Each self-hosted job therefore repeats the same admission condition
# instead of relying on `needs:` propagation alone:
#
#   * `github.repository == 'vitalyiegorov/tart-runner-fleet'` keeps downstream
#     forks from queueing jobs that only this fleet advertises labels for, and
#     keeps a renamed or transferred copy of the repository from inheriting
#     access to the fleet.
#   * the `pull_request` clause admits only branches that live in this
#     repository, so `push`, `merge_group`, and same-repo pull requests keep
#     their existing behaviour while fork heads are skipped.
#
# `Required CI` is deliberately NOT self-hosted and NOT fork-gated: it executes
# no repository content, and it must still report a *failing* required check
# when the gates above were skipped. A skipped required status check counts as
# satisfied by GitHub, so leaving it out of the run would make an unverified
# fork pull request appear mergeable.

jobs:
  preflight:
    name: Preflight
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux-go-2x4]
    timeout-minutes: 10
    outputs:
      landing: ${{ steps.landing-paths.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      # The landing job below needs a VM only when its own inputs changed. This
      # compares the event's base with the checked-out commit and fails open: any
      # base it cannot fetch or compare counts as a change.
      - name: Detect landing page changes
        id: landing-paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac
          changed=true
          case "$base" in
            ''|*[!0-9a-f]*|0000000000000000000000000000000000000000) ;;
            *)
              if git fetch --no-tags --quiet --depth=1 origin "$base" &&
                git diff --quiet "$base" HEAD -- apps/landing assets/brand package.json \
                  pnpm-workspace.yaml pnpm-lock.yaml .node-version .github/workflows/ci.yml; then
                changed=false
              fi
              ;;
          esac
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          printf 'landing page inputs changed: %s\n' "$changed"
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-pr-title.sh "$PR_TITLE"
      - name: Module, format, and workflow integrity
        run: make preflight

  quality:
    name: Lint, CPD, deadcode, and vulnerabilities
    needs: preflight
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux-go-2x4]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint and copy/paste analysis
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          skip-cache: true
      - name: Go vet
        run: make vet
      - name: Official dead-code analysis
        run: make deadcode
      - name: Explicit CPD gate
        run: make cpd
      - name: Reachable vulnerability analysis
        run: make vuln

  unit:
    name: Unit tests and exact coverage
    needs: preflight
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux-go-4x8]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Shuffled unit, contract, integration, replay, and chaos tests
        run: make unit
      # A bounded seed range of the deterministic fleet simulation (ADR 0031).
      # `make unit` already runs its default budget; this widens it to roughly a
      # minute of wall clock, which is what a review can afford. The nightly
      # sweep in nightly-simulation.yml explores the rest.
      - name: Bounded deterministic fleet simulation
        run: go test -count=1 -timeout 10m ./tests/simulation -run TestSimFuzz -seeds=80 -sim-ticks=200
      - name: Upload exact coverage evidence
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  race:
    name: Race detector
    needs: preflight
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux-go-4x8]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Shuffled race suite
        run: make race

  build:
    name: Verified builds
    needs: [quality, unit, race]
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux-go-4x8]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Native build and CLI smoke test
        run: |
          set -euo pipefail
          make build
          go run ./cmd/fleet version

      # The acceptance criterion of issue #138: a Linux node reaches the observe
      # steady state. The runner is Linux, so this is the real daemon on a real
      # machine reading its own /proc, with no Tart, no scale sets, and no
      # executor — exactly Part A of docs/MULTI_NODE_PLAN.md. The archived
      # observation is the evidence: fresh host pressure, an admitted host, and
      # a ready controller in observe mode.
      - name: Linux observe-mode daemon smoke test
        run: ./scripts/observe-smoke.sh

      # The acceptance criterion of issue #139 that no fake can produce: the
      # Podman adapter against a real rootless podman. It is best-effort here on
      # purpose. The fleet's own Linux runners are Tart guests whose image does
      # not ship a container runtime, so this reports SKIP today and turns into a
      # real gate the moment one does. The node this adapter exists for runs the
      # same script with TRF_PODMAN_SMOKE=required, which is a checklist item in
      # docs/MULTI_NODE_PLAN.md and not an optional one.
      - name: Rootless Podman executor smoke test (skips where podman is absent)
        run: ./scripts/podman-smoke.sh

      - name: Reproduce complete release candidate for every node type
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            SHORT_SHA="$(printf '%.12s' "$GITHUB_SHA")"
            VERSION="v0.1.${GITHUB_RUN_NUMBER}+main.${SHORT_SHA}"
          else
            VERSION="v0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi
          ./scripts/build-release.sh "$VERSION" dist
      - name: Upload verified CI binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  landing:
    name: Landing page
    needs: preflight
    if: >-
      needs.preflight.outputs.landing == 'true' &&
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # oxlint and next build share the 4x8 shape the sibling landing repos use.
    runs-on: [self-hosted, linux-go-4x8]
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # pnpm's version comes from the root package.json packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dead code
        run: pnpm deadcode
      - name: Production build
        run: pnpm build
      - name: Install Chromium for the smoke suite
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright and axe smoke against the production build
        run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure() && hashFiles('apps/landing/test-results/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: landing-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/landing/test-results/
          retention-days: 7

  verify:
    name: Required CI
    needs: [quality, unit, race, build, landing]
    # Run after upstream success or failure, but terminate with a superseded or
    # manually cancelled workflow. GitHub preserves always() jobs on cancel.
    # This gate never runs on the fleet and never checks out repository content,
    # so a fork pull request reaches a red required check instead of a skipped
    # one, without a single line of untrusted code executing anywhere.
    if: ${{ !cancelled() && github.repository == 'vitalyiegorov/tart-runner-fleet' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Explain why a fork pull request has no verification
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          cat >&2 <<'POLICY'
          This repository verifies changes on a self-hosted fleet of ephemeral
          Tart VMs running on a maintainer's personal hardware. Pull requests
          opened from a fork are never scheduled onto that hardware, so this
          required check reports failure by design.

          A maintainer validates external contributions by pushing the proposed
          branch into this repository and opening a pull request from it. See
          CONTRIBUTING.md, "Continuous integration for external contributions".
          POLICY
          exit 1
      - name: Require every blocking gate to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          RACE_RESULT: ${{ needs.race.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LANDING_RESULT: ${{ needs.landing.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$RACE_RESULT" = success
          test "$BUILD_RESULT" = success
          # Skipped only when preflight found no landing page input changed.
          case "$LANDING_RESULT" in success|skipped) ;; *) exit 1 ;; esac

  publish:
    name: Publish verified main release
    # Only trusted main pushes may use a release write token, and only after
    # Required CI succeeded. The explicit result check replaces the implicit
    # success(), which a skipped landing job upstream would otherwise turn
    # false for every Go-only push (actions/runner#491).
    needs: verify
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: main-production-release
      cancel-in-progress: false
    runs-on: [self-hosted, trf-linux-amd64-2x4]
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      # No github-token: the runtime API reads the same run on either the
      # fleet gate or GitHub, without a cross-run REST/storage dependency.
      - name: Download the verified main artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-release-${{ github.sha }}
          path: dist
          # The next step verifies every file against SHA256SUMS. Warning here
          # lets the #514 fix ship through a gate that still lists bare-hex
          # digests (fixed in this release), without weakening integrity.
          digest-mismatch: warn

      - name: Verify release identity, contents, and checksums
        run: |
          set -euo pipefail
          case "$HEAD_SHA" in
            *[!0-9a-f]*|'') echo "invalid main commit SHA" >&2; exit 2 ;;
          esac
          case "$RUN_NUMBER" in
            *[!0-9]*|'') echo "invalid CI run number" >&2; exit 2 ;;
          esac

          SHORT_SHA="$(printf '%.12s' "$HEAD_SHA")"
          VERSION="v0.1.${RUN_NUMBER}+main.${SHORT_SHA}"
          # ADR 0034 gives the fleet two node types, so a release carries two
          # archives and neither may be published without the other.
          ARCHIVE="tart-runner-fleet-${VERSION}-darwin-arm64.tar.gz"
          LINUX_ARCHIVE="tart-runner-fleet-${VERSION}-linux-amd64.tar.gz"

          test "$(cat dist/RELEASE_VERSION)" = "$VERSION"
          for file in \
            BUILDINFO.txt BUILDINFO-linux-amd64.txt RELEASE_VERSION SHA256SUMS \
            fleet \
            fleet-linux-amd64 \
            tart-runner-fleet-bootstrap-darwin-arm64 \
            tart-runner-fleet-bootstrap-linux-arm64 \
            tart-runner-fleet-bootstrap-linux-amd64 \
            fleet.cdx.json \
            fleet-linux-amd64.cdx.json \
            tart-runner-fleet-bootstrap-darwin-arm64.cdx.json \
            tart-runner-fleet-bootstrap-linux-arm64.cdx.json \
            tart-runner-fleet-bootstrap-linux-amd64.cdx.json \
            com.vitalyiegorov.tart-runner-fleet.plist \
            com.vitalyiegorov.tart-runner-fleet.shadow.plist \
            com.vitalyiegorov.tart-runner-fleet.canary.plist \
            com.vitalyiegorov.tart-runner-fleet.authority.plist \
            render-launchd.sh \
            tart-runner-fleet.service \
            tart-runner-fleet-shadow.service \
            tart-runner-fleet-canary.service \
            tart-runner-fleet-authority.service \
            tart-runner-fleet-updater.service \
            tart-runner-fleet-updater.timer \
            tart-runner-fleet-updater-handoff.service \
            render-systemd.sh \
            "$ARCHIVE" "$LINUX_ARCHIVE"; do
            test -f "dist/$file"
          done
          (cd dist && shasum -a 256 -c SHA256SUMS)

          # Each archive is a complete generation for its node: the controller,
          # its SBOM and build identity, the guest bootstrap helpers, and the
          # service definitions plus renderer that boot it.
          COMMON="$(printf '%s\n' \
            BUILDINFO.txt RELEASE_VERSION fleet fleet.cdx.json \
            tart-runner-fleet-bootstrap-darwin-arm64 \
            tart-runner-fleet-bootstrap-linux-arm64 \
            tart-runner-fleet-bootstrap-linux-amd64 \
            tart-runner-fleet-bootstrap-darwin-arm64.cdx.json \
            tart-runner-fleet-bootstrap-linux-arm64.cdx.json \
            tart-runner-fleet-bootstrap-linux-amd64.cdx.json)"
          EXPECTED_ARCHIVE_CONTENTS="$(printf '%s\n%s\n' "$COMMON" "$(printf '%s\n' \
            com.vitalyiegorov.tart-runner-fleet.plist \
            com.vitalyiegorov.tart-runner-fleet.shadow.plist \
            com.vitalyiegorov.tart-runner-fleet.canary.plist \
            com.vitalyiegorov.tart-runner-fleet.authority.plist \
            render-launchd.sh)" | LC_ALL=C sort)"
          ACTUAL_ARCHIVE_CONTENTS="$(tar -tzf "dist/$ARCHIVE" | LC_ALL=C sort)"
          test "$ACTUAL_ARCHIVE_CONTENTS" = "$EXPECTED_ARCHIVE_CONTENTS"

          EXPECTED_LINUX_CONTENTS="$(printf '%s\n%s\n' "$COMMON" "$(printf '%s\n' \
            tart-runner-fleet.service \
            tart-runner-fleet-shadow.service \
            tart-runner-fleet-canary.service \
            tart-runner-fleet-authority.service \
            tart-runner-fleet-updater.service \
            tart-runner-fleet-updater.timer \
            tart-runner-fleet-updater-handoff.service \
            render-systemd.sh)" | LC_ALL=C sort)"
          ACTUAL_LINUX_CONTENTS="$(tar -tzf "dist/$LINUX_ARCHIVE" | LC_ALL=C sort)"
          test "$ACTUAL_LINUX_CONTENTS" = "$EXPECTED_LINUX_CONTENTS"

          {
            echo "VERSION=$VERSION"
            echo "ARCHIVE=$ARCHIVE"
            echo "LINUX_ARCHIVE=$LINUX_ARCHIVE"
          } >> "$GITHUB_ENV"

      - name: Publish immutable production release
        run: |
          set -euo pipefail
          assets=(
            "dist/$ARCHIVE"
            "dist/$LINUX_ARCHIVE"
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/BUILDINFO-linux-amd64.txt
            dist/RELEASE_VERSION
            dist/fleet
            dist/fleet-linux-amd64
            dist/tart-runner-fleet-bootstrap-darwin-arm64
            dist/tart-runner-fleet-bootstrap-linux-arm64
            dist/tart-runner-fleet-bootstrap-linux-amd64
            dist/fleet.cdx.json
            dist/fleet-linux-amd64.cdx.json
            dist/tart-runner-fleet-bootstrap-darwin-arm64.cdx.json
            dist/tart-runner-fleet-bootstrap-linux-arm64.cdx.json
            dist/tart-runner-fleet-bootstrap-linux-amd64.cdx.json
            dist/com.vitalyiegorov.tart-runner-fleet.plist
            dist/com.vitalyiegorov.tart-runner-fleet.shadow.plist
            dist/com.vitalyiegorov.tart-runner-fleet.canary.plist
            dist/com.vitalyiegorov.tart-runner-fleet.authority.plist
            dist/render-launchd.sh
            dist/tart-runner-fleet.service
            dist/tart-runner-fleet-shadow.service
            dist/tart-runner-fleet-canary.service
            dist/tart-runner-fleet-authority.service
            dist/tart-runner-fleet-updater.service
            dist/tart-runner-fleet-updater.timer
            dist/tart-runner-fleet-updater-handoff.service
            dist/render-systemd.sh
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$VERSION" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != true ]; then
              TAG_SHA="$(gh api "repos/$GH_REPO/commits/$VERSION" --jq .sha)"
              test "$TAG_SHA" = "$HEAD_SHA"
              printf 'release %s is already published and immutable\n' "$VERSION"
              exit 0
            fi
            DRAFT_TARGET="$(gh release view "$VERSION" --json targetCommitish --jq .targetCommitish)"
            test "$DRAFT_TARGET" = "$HEAD_SHA"
          else
            gh release create "$VERSION" \
              --target "$HEAD_SHA" \
              --title "$VERSION" \
              --draft \
              --generate-notes
          fi
          # A retry may repair a partial draft. Repository-level release
          # immutability locks the assets and tag as soon as it is published.
          gh release upload "$VERSION" "${assets[@]}" --clobber
          gh release edit "$VERSION" --draft=false --latest
