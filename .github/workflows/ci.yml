name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede review builds, but never discard a main commit that must become
  # an immutable production release.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.12.2

# Self-hosted execution policy for a public repository.
#
# Every job below that carries a `self-hosted` label runs untrusted-by-default
# repository content on the maintainer's physical Mac mini inside an ephemeral
# Tart VM. A pull request opened from a fork is arbitrary code, so no fork head
# may ever be scheduled onto the fleet, even after a maintainer approves the
# run. Each self-hosted job therefore repeats the same admission condition
# instead of relying on `needs:` propagation alone:
#
#   * `github.repository == 'vitalyiegorov/tart-runner-fleet'` keeps downstream
#     forks from queueing jobs that only this fleet advertises labels for, and
#     keeps a renamed or transferred copy of the repository from inheriting
#     access to the fleet.
#   * the `pull_request` clause admits only branches that live in this
#     repository, so `push`, `merge_group`, and same-repo pull requests keep
#     their existing behaviour while fork heads are skipped.
#
# `Required CI` is deliberately NOT self-hosted and NOT fork-gated: it executes
# no repository content, and it must still report a *failing* required check
# when the gates above were skipped. A skipped required status check counts as
# satisfied by GitHub, so leaving it out of the run would make an unverified
# fork pull request appear mergeable.

jobs:
  preflight:
    name: Preflight
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux-tiered, linux-small]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-pr-title.sh "$PR_TITLE"
      - name: Module, format, and workflow integrity
        run: make preflight

  quality:
    name: Lint, CPD, deadcode, and vulnerabilities
    needs: preflight
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux-tiered, linux-medium]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint and copy/paste analysis
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          skip-cache: true
      - name: Go vet
        run: make vet
      - name: Official dead-code analysis
        run: make deadcode
      - name: Explicit CPD gate
        run: make cpd
      - name: Reachable vulnerability analysis
        run: make vuln

  unit:
    name: Unit tests and exact coverage
    needs: preflight
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, trf-linux-amd64-4x8]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Shuffled unit, contract, integration, replay, and chaos tests
        run: make unit
      # A bounded seed range of the deterministic fleet simulation (ADR 0031).
      # `make unit` already runs its default budget; this widens it to roughly a
      # minute of wall clock, which is what a review can afford. The nightly
      # sweep in nightly-simulation.yml explores the rest.
      - name: Bounded deterministic fleet simulation
        run: go test -count=1 -timeout 10m ./tests/simulation -run TestSimFuzz -seeds=80 -sim-ticks=200
      - name: Upload exact coverage evidence
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  race:
    name: Race detector
    needs: preflight
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, trf-linux-amd64-4x8]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Shuffled race suite
        run: make race

  build:
    name: Verified builds
    needs: [quality, unit, race]
    if: >-
      github.repository == 'vitalyiegorov/tart-runner-fleet' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux-tiered, linux-medium]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Native build and CLI smoke test
        run: |
          set -euo pipefail
          make build
          go run ./cmd/fleet version

      # The acceptance criterion of issue #138: a Linux node reaches the observe
      # steady state. The runner is Linux, so this is the real daemon on a real
      # machine reading its own /proc, with no Tart, no scale sets, and no
      # executor — exactly Part A of docs/MULTI_NODE_PLAN.md. The archived
      # observation is the evidence: fresh host pressure, an admitted host, and
      # a ready controller in observe mode.
      - name: Linux observe-mode daemon smoke test
        run: ./scripts/observe-smoke.sh

      # The acceptance criterion of issue #139 that no fake can produce: the
      # Podman adapter against a real rootless podman. It is best-effort here on
      # purpose. The fleet's own Linux runners are Tart guests whose image does
      # not ship a container runtime, so this reports SKIP today and turns into a
      # real gate the moment one does. The node this adapter exists for runs the
      # same script with TRF_PODMAN_SMOKE=required, which is a checklist item in
      # docs/MULTI_NODE_PLAN.md and not an optional one.
      - name: Rootless Podman executor smoke test (skips where podman is absent)
        run: ./scripts/podman-smoke.sh

      - name: Reproduce complete release candidate for every node type
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            SHORT_SHA="$(printf '%.12s' "$GITHUB_SHA")"
            VERSION="v0.1.${GITHUB_RUN_NUMBER}+main.${SHORT_SHA}"
          else
            VERSION="v0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi
          ./scripts/build-release.sh "$VERSION" dist
      - name: Upload verified CI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Required CI
    needs: [quality, unit, race, build]
    # Run after upstream success or failure, but terminate with a superseded or
    # manually cancelled workflow. GitHub preserves always() jobs on cancel.
    # This gate never runs on the fleet and never checks out repository content,
    # so a fork pull request reaches a red required check instead of a skipped
    # one, without a single line of untrusted code executing anywhere.
    if: ${{ !cancelled() && github.repository == 'vitalyiegorov/tart-runner-fleet' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Explain why a fork pull request has no verification
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          cat >&2 <<'POLICY'
          This repository verifies changes on a self-hosted fleet of ephemeral
          Tart VMs running on a maintainer's personal hardware. Pull requests
          opened from a fork are never scheduled onto that hardware, so this
          required check reports failure by design.

          A maintainer validates external contributions by pushing the proposed
          branch into this repository and opening a pull request from it. See
          CONTRIBUTING.md, "Continuous integration for external contributions".
          POLICY
          exit 1
      - name: Require every blocking gate to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          RACE_RESULT: ${{ needs.race.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$RACE_RESULT" = success
          test "$BUILD_RESULT" = success
