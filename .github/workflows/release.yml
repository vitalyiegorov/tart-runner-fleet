name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Immutable semver release identifier (v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fleet-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  build:
    name: Verify and build release
    runs-on: [self-hosted, linux-tiered, linux-medium]
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Require tagged commits to belong to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify source and workflows
        run: |
          set -euo pipefail
          make preflight vet
      - name: Lint release source
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          skip-cache: true
      - name: Reject dead code, duplication, and reachable vulnerabilities
        run: make deadcode cpd vuln
      - name: Verify race safety and exact coverage
        run: make race unit
      - name: Build twice and compare reproducible binaries and CycloneDX SBOMs
        run: ./scripts/build-release.sh "$VERSION" dist
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tart-runner-fleet-${{ env.VERSION }}-darwin-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: [self-hosted, linux-tiered, linux-small]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tart-runner-fleet-${{ github.ref_name }}-darwin-arm64
          path: dist
      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
