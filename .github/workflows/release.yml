name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      # Automatically published main releases already contain the exact
      # verified CI artifact and must not recursively rebuild themselves.
      - '!v*.*.*\+main.*'
  workflow_dispatch:
    inputs:
      version:
        description: Immutable semver release identifier (v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fleet-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  build:
    name: Verify and build release
    runs-on: [self-hosted, linux-tiered, linux-medium]
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Require tagged commits to belong to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require promoted tags to be annotated and verified
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_OBJECT_SHA="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "$TAG_OBJECT_SHA" || {
            printf 'release tag %s must be an annotated signed tag\n' "$GITHUB_REF_NAME" >&2
            exit 2
          }

          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .tag)" = \
            "$GITHUB_REF_NAME"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .object.type)" = commit
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .object.sha)" = \
            "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .verification.verified)" = \
            true || {
            reason="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .verification.reason)"
            printf 'release tag %s is not verified by GitHub: %s\n' \
              "$GITHUB_REF_NAME" "$reason" >&2
            exit 2
          }
      - name: Verify source and workflows
        run: |
          set -euo pipefail
          make preflight vet
      - name: Lint release source
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          skip-cache: true
      - name: Reject dead code, duplication, and reachable vulnerabilities
        run: make deadcode cpd vuln
      - name: Verify race safety and exact coverage
        run: make race unit
      - name: Build twice and compare reproducible binaries and CycloneDX SBOMs
        run: ./scripts/build-release.sh "$VERSION" dist
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tart-runner-fleet-${{ env.VERSION }}-darwin-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: [self-hosted, linux-tiered, linux-small]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tart-runner-fleet-${{ github.ref_name }}-darwin-arm64
          path: dist
      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || {
              printf 'release %s is already published and immutable\n' "$GITHUB_REF_NAME"
              exit 0
            }
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
