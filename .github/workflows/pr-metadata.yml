name: PR Metadata

# SECURITY: `pull_request_target` runs the workflow definition from the base
# branch with a token that can write to this repository, and it is triggered by
# pull requests opened from forks. Three invariants keep that safe and must not
# be relaxed:
#
#   1. No step checks out, fetches, or executes pull request head content. Only
#      trusted event metadata is read, and every value derived from the pull
#      request is passed through the environment rather than interpolated into
#      a shell command, so a crafted title cannot inject script.
#   2. The job runs on a GitHub-hosted runner. Fork-triggered execution must
#      never touch the maintainer's self-hosted Tart fleet, and this is the one
#      workflow a fork can start without any repository write access.
#   3. Permissions are empty at the workflow level and granted per job at the
#      narrowest scope that still lets the job attach a release-note label.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-label:
    name: Classify release note
    if: github.repository == 'vitalyiegorov/tart-runner-fleet'
    runs-on: ubuntu-latest
    permissions:
      # Pull request labels are issue labels; nothing else is written.
      issues: write
    timeout-minutes: 5
    steps:
      - name: Derive release category from Conventional Commit title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9._/-]*\))?!?: [a-z0-9].+[^.]$'
          if ! printf '%s\n' "$PR_TITLE" | grep -E -q "$pattern" ||
            [ "${#PR_TITLE}" -gt 100 ]; then
            printf 'PR title is not a supported Conventional Commit: %s\n' "$PR_TITLE" >&2
            exit 2
          fi

          type="$(printf '%s\n' "$PR_TITLE" | sed -E 's/^([a-z]+).*/\1/')"
          prefix="${PR_TITLE%%:*}"
          case "$type" in
            feat) category=release-feature ;;
            fix) category=release-fix ;;
            perf) category=release-performance ;;
            docs) category=release-documentation ;;
            chore)
              case "$prefix" in
                chore\(deps\)|chore\(dependencies\)) category=release-dependencies ;;
                *) category=release-maintenance ;;
              esac
              ;;
            build|ci|refactor|revert|style|test) category=release-maintenance ;;
            *) exit 2 ;;
          esac

          for label in \
            release-feature release-fix release-performance \
            release-documentation release-dependencies release-maintenance \
            release-breaking; do
            gh api --method DELETE \
              "repos/$GH_REPO/issues/$PR_NUMBER/labels/$label" \
              >/dev/null 2>&1 || true
          done

          apply_label() {
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
              -f "labels[]=$1" >/dev/null
          }

          # The gate this check enforces is the Conventional Commit title
          # (validated above). Labeling only feeds release-note categories,
          # and some triggering actors (Dependabot, machine accounts) hold a
          # token GitHub restricts to read-only regardless of the permissions
          # block — release.yml's catch-all category still lists the
          # unlabeled PR, so a denied label must not fail the check.
          if ! apply_label "$category"; then
            printf 'warning: token cannot label this PR (actor: %s); leaving it unlabeled\n' "$GH_ACTOR" >&2
            exit 0
          fi
          case "$prefix" in
            *!)
              apply_label release-breaking
              ;;
          esac
