name: Main Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: main-production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified main release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux-tiered, linux-small]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - name: Download the verified main artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-release-darwin-arm64-${{ github.event.workflow_run.head_sha }}
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify release identity, contents, and checksums
        run: |
          set -euo pipefail
          case "$HEAD_SHA" in
            *[!0-9a-f]*|'') echo "invalid main commit SHA" >&2; exit 2 ;;
          esac
          case "$RUN_NUMBER" in
            *[!0-9]*|'') echo "invalid CI run number" >&2; exit 2 ;;
          esac

          SHORT_SHA="$(printf '%.12s' "$HEAD_SHA")"
          VERSION="v0.1.${RUN_NUMBER}+main.${SHORT_SHA}"
          ARCHIVE="tart-runner-fleet-${VERSION}-darwin-arm64.tar.gz"

          test "$(cat dist/RELEASE_VERSION)" = "$VERSION"
          for file in \
            BUILDINFO.txt RELEASE_VERSION SHA256SUMS \
            fleet \
            tart-runner-fleet-bootstrap-darwin-arm64 \
            tart-runner-fleet-bootstrap-linux-arm64 \
            fleet.cdx.json \
            tart-runner-fleet-bootstrap-darwin-arm64.cdx.json \
            tart-runner-fleet-bootstrap-linux-arm64.cdx.json \
            com.vitalyiegorov.tart-runner-fleet.plist \
            com.vitalyiegorov.tart-runner-fleet.shadow.plist \
            com.vitalyiegorov.tart-runner-fleet.canary.plist \
            com.vitalyiegorov.tart-runner-fleet.authority.plist \
            render-launchd.sh \
            "$ARCHIVE"; do
            test -f "dist/$file"
          done
          (cd dist && shasum -a 256 -c SHA256SUMS)

          EXPECTED_ARCHIVE_CONTENTS="$(printf '%s\n' \
            BUILDINFO.txt RELEASE_VERSION fleet fleet.cdx.json \
            tart-runner-fleet-bootstrap-darwin-arm64 \
            tart-runner-fleet-bootstrap-linux-arm64 \
            tart-runner-fleet-bootstrap-darwin-arm64.cdx.json \
            tart-runner-fleet-bootstrap-linux-arm64.cdx.json \
            com.vitalyiegorov.tart-runner-fleet.plist \
            com.vitalyiegorov.tart-runner-fleet.shadow.plist \
            com.vitalyiegorov.tart-runner-fleet.canary.plist \
            com.vitalyiegorov.tart-runner-fleet.authority.plist \
            render-launchd.sh | LC_ALL=C sort)"
          ACTUAL_ARCHIVE_CONTENTS="$(tar -tzf "dist/$ARCHIVE" | LC_ALL=C sort)"
          test "$ACTUAL_ARCHIVE_CONTENTS" = "$EXPECTED_ARCHIVE_CONTENTS"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish immutable production release
        run: |
          set -euo pipefail
          assets=(
            "dist/$ARCHIVE"
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/RELEASE_VERSION
            dist/fleet
            dist/tart-runner-fleet-bootstrap-darwin-arm64
            dist/tart-runner-fleet-bootstrap-linux-arm64
            dist/fleet.cdx.json
            dist/tart-runner-fleet-bootstrap-darwin-arm64.cdx.json
            dist/tart-runner-fleet-bootstrap-linux-arm64.cdx.json
            dist/com.vitalyiegorov.tart-runner-fleet.plist
            dist/com.vitalyiegorov.tart-runner-fleet.shadow.plist
            dist/com.vitalyiegorov.tart-runner-fleet.canary.plist
            dist/com.vitalyiegorov.tart-runner-fleet.authority.plist
            dist/render-launchd.sh
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$VERSION" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != true ]; then
              TAG_SHA="$(gh api "repos/$GH_REPO/commits/$VERSION" --jq .sha)"
              test "$TAG_SHA" = "$HEAD_SHA"
              printf 'release %s is already published and immutable\n' "$VERSION"
              exit 0
            fi
            DRAFT_TARGET="$(gh release view "$VERSION" --json targetCommitish --jq .targetCommitish)"
            test "$DRAFT_TARGET" = "$HEAD_SHA"
          else
            gh release create "$VERSION" \
              --target "$HEAD_SHA" \
              --title "$VERSION" \
              --draft \
              --generate-notes
          fi
          # A retry may repair a partial draft. Repository-level release
          # immutability locks the assets and tag as soon as it is published.
          gh release upload "$VERSION" "${assets[@]}" --clobber
          gh release edit "$VERSION" --draft=false --latest
